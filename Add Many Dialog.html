<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }
  body { font-family: Calibri, Arial, sans-serif; margin: 0; color: #1f2d3d; font-size: 14px; }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 10px 12px; gap: 8px; }
  .top { display: flex; gap: 8px; }
  #ordBtn { flex: none; background: #1f4e5f; color: #fff; padding: 8px 12px; font-size: 14px; }
  #ordBtn:disabled { background: #b0bec5; cursor: default; }
  #q { flex: 1; min-width: 0; width: 100%; font-size: 16px; padding: 9px 10px; border: 2px solid #1f4e5f; border-radius: 6px; outline: none; }
  #q:focus { border-color: #6a1b9a; }
  .hint { font-size: 12px; color: #667; }
  .list { flex: 1; overflow-y: auto; border: 1px solid #cfd8dc; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid #eef2f4; cursor: pointer; }
  .row:hover { background: #f3f8fa; }
  .row.on { background: #e8f5e9; }
  .row input[type=checkbox] { width: 18px; height: 18px; flex: none; cursor: pointer; }
  .row .nm { flex: 1; text-transform: uppercase; }
  .row .pl { flex: none; font-size: 11px; color: #90a4ae; margin-right: -4px; }
  .row input.pk { width: 58px; font-size: 13px; padding: 5px 4px; text-align: right; border: 1px solid #cfd8dc; border-radius: 4px; color: #455a64; }
  .row input.pk:focus { outline: 2px solid #6a1b9a; }
  .pkd { flex: none; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: bold; color: #1f4e5f; }
  .pkd input { font-size: 14px; padding: 6px; border: 2px solid #1f4e5f; border-radius: 6px; }
  .row input.qty { width: 70px; font-size: 15px; padding: 5px 6px; text-align: right; border: 1px solid #b0bec5; border-radius: 4px; }
  .row input.qty:focus { outline: 2px solid #6a1b9a; border-color: #6a1b9a; }
  .row .hd { flex: none; cursor: grab; color: #90a4ae; font-size: 18px; padding: 0 2px; touch-action: none; user-select: none; }
  .row .no { flex: none; width: 22px; text-align: right; color: #607d8b; font-size: 12px; }
  .row .mv { flex: none; border: 1px solid #cfd8dc; background: #fff; border-radius: 4px; padding: 2px 6px; font-size: 12px; cursor: pointer; color: #37474f; }
  .row .mv:disabled { opacity: 0.3; cursor: default; }
  .row.ord { position: relative; background-clip: padding-box; }
  .row.drag { z-index: 5; background: #f3e5f5; box-shadow: 0 8px 20px rgba(0,0,0,0.25); border-radius: 6px; cursor: grabbing; }
  .row.ord:not(.drag) { background-color: #e8f5e9; }
  .head { font-size: 12px; font-weight: bold; color: #fff; background: #1f4e5f; padding: 5px 8px; position: sticky; top: 0; z-index: 1; }
  .empty { padding: 16px; color: #889; text-align: center; }
  .foot { display: flex; align-items: center; gap: 10px; }
  .sum { flex: 1; font-size: 13px; }
  .keep { display: block; margin-top: 4px; font-size: 12px; color: #455a64; cursor: pointer; }
  .keep input { vertical-align: -2px; margin: 0 4px 0 0; }
  .sum b { font-size: 15px; }
  .over { color: #c62828; font-weight: bold; }
  button { font-family: inherit; font-size: 15px; font-weight: bold; padding: 9px 16px; border-radius: 6px; border: none; cursor: pointer; }
  #go { background: #6a1b9a; color: #fff; }
  #go:disabled { background: #b39ddb; cursor: default; }
  #cancel { background: #eceff1; color: #333; }
  #msg { font-size: 13px; }
  #msg.err { color: #c62828; font-weight: bold; }
  #msg.ok { color: #2e7d32; font-weight: bold; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #b39ddb; border-top-color: #6a1b9a; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <label class="pkd">PKD <input type="date" id="pkd"></label>
    <input id="q" placeholder="Type to search, e.g. bold badam" autocomplete="off" autofocus>
    <button id="ordBtn" onclick="showOrder()" disabled title="See all ticked products and change their order">↕ Order</button>
  </div>
  <div class="hint">Tick a product (qty 1) or type a qty. Small box = packing size (default 1). Search again to add more — ticks are kept. Enter jumps to the next qty box. ↕ Order = see all ticked products and change their order.</div>
  <div class="list" id="list"><div class="empty"><span class="spin"></span>Loading products…</div></div>
  <div id="msg"></div>
  <div class="foot">
    <div class="sum"><div id="sum"></div><label class="keep"><input type="checkbox" id="saveOrd" checked> Save this order in Product List</label></div>
    <button id="cancel" onclick="google.script.host.close()">Cancel</button>
    <button id="go" onclick="submitAll()" disabled>Submit</button>
  </div>
</div>
<script>
  var names = [], used = 0, limit = 240, loaded = false;
  (function () { var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    document.getElementById('pkd').value = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); })();
  // Cursor in the search box straight away (you can type while products load)
  function focusQ() { var q = document.getElementById('q'); if (document.activeElement !== q && !busy) q.focus(); }
  focusQ(); window.addEventListener('load', focusQ); setTimeout(focusQ, 150); setTimeout(focusQ, 500);
  var picked = {};   // name -> qty (only ticked ones)
  var packs = {};    // name -> packing size (default 1)
  var order = [];    // names in the order they were ticked
  var busy = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  google.script.run
    .withSuccessHandler(function (r) {
      names = r.names || []; used = r.used || 0; limit = r.limit || 240;
      var q = document.getElementById('q');
      loaded = true; focusQ();
      render();
    })
    .withFailureHandler(function (e) { showMsg('Could not load products: ' + e.message, 'err'); })
    .amGetProducts();

  function matches(q) {
    var words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    var out = [];
    for (var i = 0; i < names.length && out.length < 300; i++) {
      var n = names[i].toLowerCase(), ok = true;
      for (var w = 0; w < words.length; w++) if (n.indexOf(words[w]) < 0) { ok = false; break; }
      if (ok) out.push(names[i]);
    }
    return out;
  }

  function rowHtml(n, i, ord) {
    var on = picked.hasOwnProperty(n);
    var last = order.length - 1;
    return '<div class="row' + (on ? ' on' : '') + (ord ? ' ord' : '') + '" data-n="' + esc(n) + '">' +
      (ord ? '<span class="hd" title="Drag to change the order">⠿</span><span class="no">' + (i + 1) + '</span>' : '') +
      '<input type="checkbox"' + (on ? ' checked' : '') + ' tabindex="-1">' +
      '<span class="nm">' + esc(n) + '</span>' +
      '<span class="pl">Pack</span><input class="pk" type="number" min="0" step="0.25" inputmode="decimal" title="Packing size" value="' + (packs[n] || 1) + '">' +
      '<span class="pl">Qty</span><input class="qty" type="number" min="1" step="1" inputmode="numeric" title="Sticker qty" value="' + (on ? picked[n] : '') + '">' +
      (ord ? '<button class="mv" data-d="-1" tabindex="-1"' + (i === 0 ? ' disabled' : '') + ' title="Move up">↑</button>' +
             '<button class="mv" data-d="1" tabindex="-1"' + (i === last ? ' disabled' : '') + ' title="Move down">↓</button>' : '') +
      '</div>';
  }

  function renumber() {
    var rows = document.querySelectorAll('#list .row.ord');
    for (var i = 0; i < rows.length; i++) {
      var k = order.indexOf(rows[i].getAttribute('data-n'));
      rows[i].querySelector('.no').textContent = k >= 0 ? k + 1 : '–';
    }
  }

  function render() {
    var q = document.getElementById('q').value.trim();
    var list = document.getElementById('list');
    var html = '';
    var found = matches(q);
    var foundSet = {};
    found.forEach(function (n) { foundSet[n] = 1; });
    var others = order.filter(function (n) { return !foundSet[n]; });
    if (q) {
      html += '<div class="head">' + (found.length ? found.length + (found.length >= 300 ? '+' : '') + ' match' + (found.length === 1 ? '' : 'es') + ' for “' + esc(q) + '”' : 'No product has “' + esc(q) + '”') + '</div>';
      html += found.map(function (n) { return rowHtml(n); }).join('');
    }
    if (others.length) {
      if (q) {
        html += '<div class="head">Ticked (' + others.length + ' more) — clear the search to change the order</div>';
        html += others.map(function (n) { return rowHtml(n); }).join('');
      } else {
        html += '<div class="head">Ticked (' + others.length + ') — this is the order they go in. Drag a row (or ⠿) or use ↑ ↓</div>';
        html += others.map(function (n, i) { return rowHtml(n, i, true); }).join('');
      }
    }
    if (!loaded) html = '<div class="empty"><span class="spin"></span>Loading products…</div>';
    if (!html) html = '<div class="empty">Start typing a product name above.</div>';
    list.innerHTML = html;
    updateSum();
  }

  function setQty(n, v, row) {
    var qty = parseInt(v, 10);
    if (qty > 0) {
      if (!picked.hasOwnProperty(n)) order.push(n);
      picked[n] = qty;
    } else if (picked.hasOwnProperty(n)) {
      delete picked[n];
      order = order.filter(function (x) { return x !== n; });
    }
    if (row) {
      var on = picked.hasOwnProperty(n);
      row.classList.toggle('on', on);
      row.querySelector('input[type=checkbox]').checked = on;
    }
    updateSum();
  }

  function showOrder() {
    var q = document.getElementById('q');
    q.value = '';
    render();
    document.getElementById('list').scrollTop = 0;
  }

  function updateSum() {
    var total = 0;
    order.forEach(function (n) { total += picked[n]; });
    var after = used + total;
    var s = '<b>' + order.length + '</b> product' + (order.length === 1 ? '' : 's') + ' · <b>' + total + '</b> stickers';
    s += '<br><span class="' + (after > limit ? 'over' : '') + '">Already in list ' + used + ' → after: ' + after + ' / ' + limit + (after > limit ? ' — over the limit' : '') + '</span>';
    document.getElementById('sum').innerHTML = s;
    document.getElementById('go').disabled = busy || !order.length || after > limit;
    document.getElementById('ordBtn').disabled = busy || !order.length;
    document.getElementById('ordBtn').textContent = order.length ? '↕ Order (' + order.length + ')' : '↕ Order';
    document.getElementById('go').textContent = order.length ? 'Submit (' + order.length + ')' : 'Submit';
  }

  function showMsg(t, cls) { var m = document.getElementById('msg'); m.className = cls || ''; m.innerHTML = t; }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      var first = document.querySelector('#list input.qty');
      if (first) { e.preventDefault(); first.focus(); first.select(); }
    }
  });

  var listEl = document.getElementById('list');
  listEl.addEventListener('input', function (e) {
    if (e.target.classList.contains('pk')) {
      var pv = parseFloat(e.target.value);
      packs[e.target.closest('.row').getAttribute('data-n')] = pv > 0 ? pv : 1;
      return;
    }
    if (!e.target.classList.contains('qty')) return;
    var row = e.target.closest('.row');
    setQty(row.getAttribute('data-n'), e.target.value, row);
    renumber();
  });
  listEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (noClick || !row || e.target.classList.contains('qty') || e.target.classList.contains('pk') || e.target.classList.contains('hd')) return;
    if (e.target.classList.contains('mv')) {
      var nm = row.getAttribute('data-n'), k = order.indexOf(nm), to = k + Number(e.target.getAttribute('data-d'));
      if (k < 0 || to < 0 || to >= order.length) return;
      order.splice(k, 1); order.splice(to, 0, nm);
      render();
      return;
    }
    var n = row.getAttribute('data-n');
    var box = row.querySelector('input.qty');
    if (picked.hasOwnProperty(n)) {  // untick
      box.value = '';
      setQty(n, '', row);
    } else {                          // tick → qty 1 (selected, so typing replaces it)
      box.value = '1';
      setQty(n, '1', row);
      renumber();
      box.focus(); box.select();
    }
  });
  listEl.addEventListener('keydown', function (e) {
    if (!e.target.classList.contains('qty')) return;
    var boxes = Array.prototype.slice.call(document.querySelectorAll('#list input.qty'));
    var i = boxes.indexOf(e.target);
    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (boxes[i + 1]) { boxes[i + 1].focus(); boxes[i + 1].select(); }
      else document.getElementById('q').focus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (boxes[i - 1]) { boxes[i - 1].focus(); boxes[i - 1].select(); }
      else document.getElementById('q').focus();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      var q = document.getElementById('q'); q.focus(); q.select();
    }
  });

  // Smooth drag to reorder (like a phone list): the row follows the pointer, the others slide aside.
  // Mouse: press anywhere on a row (not on qty / buttons) and move. Touch: use the ⠿ handle.
  var drag = null, pend = null, noClick = false;
  listEl.addEventListener('pointerdown', function (e) {
    var row = e.target.closest('.row.ord');
    if (!row || busy) return;
    var t = e.target;
    if (t.classList.contains('qty') || t.classList.contains('pk') || t.classList.contains('mv')) return;
    var onHandle = t.classList.contains('hd');
    if (!onHandle && e.pointerType !== 'mouse') return;
    if (onHandle) e.preventDefault();
    pend = { row: row, y0: e.clientY, now: onHandle };
    if (onHandle) beginDrag(e);
  });
  function beginDrag(e) {
    var rows = Array.prototype.slice.call(document.querySelectorAll('#list .row.ord'));
    var me = pend.row, idx = rows.indexOf(me);
    drag = {
      row: me, rows: rows, idx: idx, to: idx, y0: pend.y0, s0: listEl.scrollTop,
      h: me.offsetHeight, mids: rows.map(function (r) { return r.offsetTop + r.offsetHeight / 2; })
    };
    pend = null;
    rows.forEach(function (r) { if (r !== me) r.style.transition = 'transform 0.18s ease'; });
    me.classList.add('drag');
    document.body.style.userSelect = 'none';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    tickScroll();
  }
  function layout(clientY) {
    if (!drag) return;
    drag.lastY = clientY;
    var dy = clientY - drag.y0 + (listEl.scrollTop - drag.s0);
    var rows = drag.rows, idx = drag.idx;
    var lo = drag.mids[0] - drag.mids[idx], hi = drag.mids[rows.length - 1] - drag.mids[idx];
    dy = Math.max(lo - drag.h / 2, Math.min(hi + drag.h / 2, dy));
    drag.row.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
    var c = drag.mids[idx] + dy, to = idx;
    for (var j = 0; j < rows.length; j++) {
      if (j === idx) continue;
      var shift = 0;
      if (j > idx && c > drag.mids[j]) { shift = -drag.h; to = Math.max(to, j); }
      else if (j < idx && c < drag.mids[j]) { shift = drag.h; to = Math.min(to, j); }
      rows[j].style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    }
    drag.to = to;
  }
  function tickScroll() {
    if (!drag) return;
    var y = drag.lastY, box = listEl.getBoundingClientRect();
    if (y != null) {
      var v = y < box.top + 40 ? -Math.ceil((box.top + 40 - y) / 4) : y > box.bottom - 40 ? Math.ceil((y - box.bottom + 40) / 4) : 0;
      if (v) { listEl.scrollTop += v; layout(y); }
    }
    requestAnimationFrame(tickScroll);
  }
  document.addEventListener('pointermove', function (e) {
    if (pend && !drag) {
      if (Math.abs(e.clientY - pend.y0) < 5) return;
      beginDrag(e);
    }
    if (!drag) return;
    e.preventDefault();
    layout(e.clientY);
  });
  function endDrag() {
    pend = null;
    if (!drag) return;
    var d = drag; drag = null;
    noClick = true; setTimeout(function () { noClick = false; }, 50);
    document.body.style.userSelect = '';
    // glide into the new slot, then redraw
    var slot = d.mids[d.to] - d.mids[d.idx];
    if (d.to > d.idx) slot = d.rows[d.to].offsetTop + d.rows[d.to].offsetHeight - d.h - d.row.offsetTop;
    else if (d.to < d.idx) slot = d.rows[d.to].offsetTop - d.row.offsetTop;
    else slot = 0;
    d.row.style.transition = 'transform 0.15s ease';
    d.row.style.transform = 'translateY(' + slot + 'px)';
    var names = d.rows.map(function (r) { return r.getAttribute('data-n'); });
    var nm = names.splice(d.idx, 1)[0];
    names.splice(d.to, 0, nm);
    names = names.filter(function (n) { return picked.hasOwnProperty(n); });
    setTimeout(function () {
      order = names.concat(order.filter(function (n) { return names.indexOf(n) < 0; }));
      var top = listEl.scrollTop;
      render();
      listEl.scrollTop = top;
    }, 160);
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  try { if (localStorage.getItem('am_saveOrd') === '0') document.getElementById('saveOrd').checked = false; } catch (e) {}
  document.getElementById('saveOrd').addEventListener('change', function () {
    try { localStorage.setItem('am_saveOrd', this.checked ? '1' : '0'); } catch (e) {}
  });

  // After inserting: move the rows in Product List into this order (if ticked), then show the result
  function afterInsert(names, text, cls, close) {
    var done = function (extra) {
      showMsg(text + extra, cls);
      if (close) setTimeout(function () { google.script.host.close(); }, 1500);
    };
    if (!document.getElementById('saveOrd').checked || names.length < 2) { done(''); return; }
    showMsg(text + '<br><span class="spin"></span>Saving the order in Product List…', cls);
    google.script.run
      .withSuccessHandler(function (o) {
        done(o.error ? '<br>⚠ ' + esc(o.error) : '<br>Order saved in Product List' + (o.moved ? ' (rows ' + o.from + '–' + o.to + ')' : ' (already in this order)') + '.');
      })
      .withFailureHandler(function (e) { done('<br>⚠ Order not saved in Product List: ' + esc(e.message)); })
      .amSaveOrder(names);
  }

  function submitAll() {
    if (busy || !order.length) return;
    var names = order.slice();
    var items = order.map(function (n) { return { name: n, qty: picked[n], pack: packs[n] || 1 }; });
    var pkdVal = document.getElementById('pkd').value;
    busy = true; updateSum();
    document.getElementById('q').disabled = true;
    showMsg('<span class="spin"></span>Inserting ' + items.length + ' product' + (items.length === 1 ? '' : 's') + '… keep this window open');
    google.script.run
      .withSuccessHandler(function (r) {
        busy = false;
        if (r.error) { document.getElementById('q').disabled = false; updateSum(); showMsg(r.error, 'err'); return; }
        if (r.skipped && r.skipped.length) {
          afterInsert(names, 'Inserted ' + r.inserted + '. Skipped ' + r.skipped.length + ':<br>' + r.skipped.map(esc).join('<br>'), 'err', false);
          picked = {}; order = []; used = 0;
          document.getElementById('go').style.display = 'none';
          document.getElementById('cancel').textContent = 'Close';
          render();
        } else {
          afterInsert(names, '✅ Inserted ' + r.inserted + ' product' + (r.inserted === 1 ? '' : 's') + (r.fast ? ' ⚡' : ' (slow way)') + '.', 'ok', true);
        }
      })
      .withFailureHandler(function (e) {
        busy = false; document.getElementById('q').disabled = false; updateSum();
        showMsg('Stopped with an error: ' + esc(e.message) + '<br>Check the sticker list — some products may already be inserted.', 'err');
      })
      .amInsertMany(items, { pkd: pkdVal });
  }
</script>
</body>
</html>
