<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: Arial, sans-serif; font-size: 13px; margin: 0; padding: 8px 10px; color: #202124; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  label { display: flex; flex-direction: column; font-weight: bold; font-size: 11px; gap: 2px; color: #444; }
  input[type=text], select { font-size: 14px; padding: 5px 7px; border: 1px solid #aaa; border-radius: 4px; }
  input:focus, select:focus { outline: 2px solid #4a86c8; }
  #top { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; background: #f1f5fb; border: 1px solid #c8d3e3; border-radius: 8px; padding: 8px; }
  #q { width: 200px; } #qty { width: 80px; } #rate { width: 80px; } #unit { width: 100px; } #tax { width: 112px; }
  .seg { display: flex; } .seg label { flex-direction: row; font-size: 13px; font-weight: bold; margin: 0; padding: 6px 8px; border: 1px solid #1f3d66; color: #1f3d66; cursor: pointer; background: #fff; }
  .seg label:first-child { border-radius: 4px 0 0 4px; } .seg label:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .seg input { position: absolute; opacity: 0; width: 0; height: 0; } .seg label { position: relative; } .seg label.on { background: #1f3d66; color: #fff; }
  #main { display: flex; gap: 10px; min-height: 0; flex: 0 1 auto; max-height: 48%; }
  #left { flex: 1 1 60%; min-width: 0; overflow: auto; border: 1px solid #dadce0; border-radius: 8px; padding: 6px 8px; }
  #right { flex: 1 1 40%; min-width: 250px; display: flex; flex-direction: column; gap: 6px; }
  #listbox { flex: 1 1 auto; min-height: 90px; display: flex; flex-direction: column; border: 1px solid #dadce0; border-radius: 8px; padding: 6px 8px; }
  #listscroll { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { background: #4a86c8; color: #fff; padding: 3px 6px; text-align: left; font-size: 11px; }
  td { border-bottom: 1px solid #e3e3e3; padding: 2px 6px; }
  td.n, th.n { text-align: right; }
  .kg { width: 80px; text-align: right; padding: 3px 6px; font-size: 13px; }
  .ed { width: 70px; text-align: right; padding: 2px 4px; font-size: 13px; }
  .muted { color: #777; font-size: 12px; }
  .err { color: #c00; font-weight: bold; }
  .ok { color: #1e8e3e; font-weight: bold; }
  .calc { background: #fff8e1; border: 1px solid #f0d98a; border-radius: 6px; padding: 6px 9px; line-height: 1.5; flex: 1; overflow: auto; }
  button { font-size: 13px; padding: 6px 12px; border: 1px solid #1f3d66; background: #1f3d66; color: #fff; border-radius: 4px; cursor: pointer; }
  button.sec { background: #fff; color: #1f3d66; }
  button.mini { padding: 1px 7px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  button.big { font-size: 15px; padding: 9px 14px; }
  .radio { flex-direction: row; align-items: center; gap: 4px; font-weight: normal; font-size: 12px; }
  .grp { display: block; width: 100%; text-align: left; background: #fff; color: #202124; border: 1px solid #c8d3e3; margin-bottom: 3px; padding: 4px 9px; }
  .grp.sel { background: #e8f0fe; border-color: #1f3d66; font-weight: bold; }
  .tot td { font-weight: bold; border-top: 2px solid #999; }
  .editing td { background: #fff8e1; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="top">
  <label>Product (name, no size) <input type="text" id="q" placeholder="premium jumbo walnut" autocomplete="off"></label>
  <label>Quantity <input type="text" id="qty" placeholder="10kg" autocomplete="off"></label>
  <label>Rate <input type="text" id="rate" placeholder="800" autocomplete="off"></label>
  <label>Rate is <select id="unit"><option value="kg">per kg</option><option value="all">whole qty</option></select></label>
  <label>Tax code <select id="tax"></select></label>
  <div><div class="muted" style="font-size:11px;font-weight:bold;color:#444">Rate…</div>
    <div class="seg" id="seg"><label id="sIncl"><input type="radio" name="inc" value="incl">INCLUDES tax</label><label id="sExcl"><input type="radio" name="inc" value="excl">EXCLUDES tax</label></div></div>
</div>

<div id="main">
  <div id="left">
    <div class="bar" id="lefttop" style="margin:0 0 4px;position:sticky;top:-6px;background:#fff;z-index:3;padding:2px 0"><button id="eq" class="sec" style="display:none" title="Share the quantity equally (by weight) between the ticked sizes, whole packs only">⚖ Split equal</button><span id="rem"></span></div>
    <div id="hint" class="muted">Loading products…</div>
    <div id="groups" style="margin:4px 0"></div>
    <table id="vt" style="display:none">
      <thead><tr><th title="tick = included in Split equal"></th><th>Size</th><th>Product</th><th class="n">NPP</th><th class="n">kg</th><th class="n">Packs</th><th></th></tr></thead>
      <tbody id="vb"></tbody>
    </table>
  </div>
  <div id="right">
    <div id="calc" class="calc muted">Type the rate, choose including / excluding tax and the tax code.</div>
    <div id="errs" class="err" style="font-size:12px"></div>
    <div class="bar" style="margin:0">
      <button id="add" class="big" disabled>Add to list ⏎</button>
      <label class="radio"><input type="checkbox" id="fast" checked> Fast: put in sheet at once</label>
    </div>
  </div>
</div>

<div id="listbox">
  <div><b style="color:#1f3d66">List for the sheet</b> <span id="cnt" class="muted"></span></div>
  <div id="listscroll">
    <table id="lt" style="display:none">
      <thead><tr><th>Product (as in sheet)</th><th class="n">Packs</th><th class="n">Cost/pack ex tax</th><th>Tax</th><th class="n">Total ex tax</th><th class="n">Total incl tax</th><th></th></tr></thead>
      <tbody id="lb"></tbody>
    </table>
    <div id="lempty" class="muted">Nothing yet. Fill the top row, give the kg per size, then “Add to list” (or press Enter).</div>
  </div>
  <div class="bar">
    <button id="put" disabled>Put in sheet</button>
    <button id="dl" class="sec">⬇ Download XLSX for POS</button>
    <span id="msg"></span>
    <span id="dlbox"></span>
  </div>
</div>

<script>
// ---------- pure helpers (also run in node for testing) ----------
// number + unit anywhere in a text: 200g, 200 gm, 1kg, .5 kg, 10 KGS …
var SIZE_RE = /(\d*\.?\d+)\s*(KILOGRAMS?|KILOS?|KGS?|GRAMS?|GRMS?|GMS?|G)(?![A-Z])/gi;
function unitG(u) { return /^K/i.test(u) ? 1000 : 1; }
// Sum of all sizes in a text ("10kg 500g" = 10500). Plain number only (qtyMode) = kg.
function parseSum(text, qtyMode) {
  var s = String(text || ''), g = 0, found = false, m;
  SIZE_RE.lastIndex = 0;
  while ((m = SIZE_RE.exec(s))) { g += parseFloat(m[1]) * unitG(m[2]); found = true; }
  if (!found && qtyMode && /^\s*(\d*\.?\d+)\s*$/.test(s)) { g = parseFloat(s) * 1000; found = true; }
  return found ? g : 0;
}
// Pack size of a product name = the LAST size in it (grams), 0 if none.
function sizeOfName(name) {
  var s = String(name || ''), g = 0, m;
  SIZE_RE.lastIndex = 0;
  while ((m = SIZE_RE.exec(s))) g = parseFloat(m[1]) * unitG(m[2]);
  return g;
}
function stripSizes(text) { return String(text || '').replace(SIZE_RE, ' ').replace(/\s+/g, ' ').trim(); }
function searchTokens(text) {
  return stripSizes(text).toUpperCase().split(/[\s,]+/).filter(Boolean).map(function (t) {
    return (t.length > 3 && /S$/.test(t)) ? t.slice(0, -1) : t;   // walnuts -> walnut
  });
}
function sizeLabel(g) { return g >= 1000 ? (g / 1000) + ' kg' : g + ' g'; }
function round4(x) { return Math.round(x * 10000) / 10000; }
// Rate maths. rate: typed number, perKg: true = rate is per kg else for the whole qty,
// incl: rate includes tax, taxPct: tax %, qtyKg. Returns {exKg, inclKg} (per kg, 4 decimals).
function rateMath(rate, perKg, incl, taxPct, qtyKg) {
  var perKgRate = perKg ? rate : rate / qtyKg;
  var ex = incl ? perKgRate / (1 + taxPct / 100) : perKgRate;
  return { exKg: ex, inclKg: ex * (1 + taxPct / 100) };
}
// ---------- end pure helpers ----------

var useSz = {}, P = [], TAX = {}, defTax = '', loaded = false;
var cands = [], noSize = 0, kgs = {}, items = [];
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function f2(x) { return (Math.round(x * 100) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function numOf(id) { var v = $(id).value.replace(/,/g, '').trim(); return v !== '' && isFinite(v) ? Number(v) : NaN; }
function qtyG() { return parseSum($('qty').value, true) || parseSum($('q').value, false); }

var groups = [], selGroup = '', showAll = false;
// A product matches when every typed word is the START of a word in its name (so "wa" finds Walnut, not Ajwa).
// Matching products are grouped by name without the size; you pick one group, its sizes are the rows to split.
function findCands() {
  var toks = searchTokens($('q').value);
  cands = []; noSize = 0; groups = [];
  if (!loaded || !toks.length) { selGroup = ''; return; }
  var by = {};
  P.forEach(function (p) {
    for (var i = 0; i < toks.length; i++) {
      var ok = false;
      for (var w = 0; w < p.words.length; w++) if (p.words[w].indexOf(toks[i]) === 0) { ok = true; break; }
      if (!ok) return;
    }
    if (!(p.g > 0)) { noSize++; return; }
    (by[p.base] = by[p.base] || []).push(p);
  });
  Object.keys(by).sort().forEach(function (k) { by[k].sort(function (a, b) { return a.g - b.g; }); groups.push({ base: k, items: by[k] }); });
  if (groups.length === 1) selGroup = groups[0].base;
  if (!groups.some(function (g) { return g.base === selGroup; })) selGroup = '';
  groups.forEach(function (g) { if (g.base === selGroup) cands = g.items.slice(0, 40); });
}

function renderVariants() {
  findCands();
  var vb = $('vb'); vb.innerHTML = '';
  var hint = $('hint');
  if (!loaded) hint.textContent = 'Loading products…';
  else if (!searchTokens($('q').value).length) hint.textContent = 'Type the product name. Sizes (200g, 1kg…) are found automatically; a size typed here (…walnut 40kg) is used as the quantity.';
  else if (!groups.length) hint.innerHTML = '<span class="err">No product with a pack size matches these words.</span>' + (noSize ? ' (' + noSize + ' match without a size in the name)' : '');
  else if (!cands.length) hint.textContent = groups.length + ' products match - click the one you bought.' + (noSize ? ' (+' + noSize + ' match without a size in the name, not used)' : '');
  else hint.textContent = cands.length + ' pack size(s) of this product. Type how many kg go to each size.' + (noSize ? ' (+' + noSize + ' other match without a size in the name, not used)' : '');
  var gb = $('groups'); gb.innerHTML = '';
  if (groups.length > 1) {
    var shown = (selGroup && !showAll) ? groups.filter(function (g) { return g.base === selGroup; }) : groups;
    shown.forEach(function (g) {
      var b = document.createElement('button'); b.className = 'grp' + (g.base === selGroup ? ' sel' : ''); b.setAttribute('data-g', g.base);
      b.innerHTML = esc(g.items[0].name.replace(SIZE_RE, ' ').replace(/\s+/g, ' ').trim()) + ' <span class="muted">— ' + g.items.map(function (p) { return sizeLabel(p.g); }).join(', ') + '</span>';
      gb.appendChild(b);
    });
    if (selGroup && !showAll) {
      var o = document.createElement('button'); o.className = 'sec mini'; o.setAttribute('data-other', '1'); o.textContent = '▾ ' + (groups.length - 1) + ' other matches';
      gb.appendChild(o);
    }
  }
  $('vt').style.display = cands.length ? '' : 'none';
  $('eq').style.display = cands.length > 1 ? '' : 'none';
  cands.forEach(function (p) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><input type="checkbox" data-use="' + esc(p.code) + '"' + (useSz[p.code] === false ? '' : ' checked') + '></td><td><b>' + esc(sizeLabel(p.g)) + '</b></td><td>' + esc(p.name) + '</td><td class="n">' + (p.npp === '' ? '–' : f2(p.npp)) +
      '</td><td class="n"><input type="text" class="kg" data-c="' + esc(p.code) + '" value="' + esc(kgs[p.code] || '') + '" placeholder="kg"></td>' +
      '<td class="n" data-pk="' + esc(p.code) + '"></td><td><button class="sec mini" data-fill="' + esc(p.code) + '" title="Put all the remaining kg here">rest ↵</button></td>';
    vb.appendChild(tr);
  });
  recalc();
}

// returns the plan (or errors) and refreshes the live numbers
function recalc() {
  var errs = [], rows = [], sumKg = 0;
  var qG = qtyG(), qKg = qG / 1000;
  cands.forEach(function (p) {
    var raw = (kgs[p.code] || '').trim();
    var g = raw === '' ? 0 : (parseSum(raw, true));
    var cell = document.querySelector('[data-pk="' + CSS.escape(p.code) + '"]');
    if (raw !== '' && !g) { if (cell) cell.innerHTML = '<span class="err">?</span>'; errs.push('Cannot read "' + raw + '" for ' + sizeLabel(p.g)); return; }
    if (!g) { if (cell) cell.textContent = ''; return; }
    var kg = g / 1000, rawPk = g / p.g, pk = Math.round(rawPk);
    sumKg += kg;
    if (Math.abs(rawPk - pk) > 1e-6) {
      if (cell) cell.innerHTML = '<span class="err">' + (Math.round(rawPk * 100) / 100) + '</span>';
      errs.push(sizeLabel(p.g) + ': ' + kg + ' kg = ' + (Math.round(rawPk * 100) / 100) + ' packs - use whole packs');
    } else {
      if (cell) cell.textContent = pk;
      rows.push({ p: p, kg: kg, packs: pk });
    }
  });
  sumKg = Math.round(sumKg * 1e6) / 1e6;
  var left = Math.round((qKg - sumKg) * 1e6) / 1e6;
  var rem = $('rem');
  if (!cands.length) rem.textContent = '';
  else if (!qG) rem.innerHTML = '<span class="err">Type the quantity bought (e.g. 10kg).</span>';
  else if (left === 0) rem.innerHTML = '<span class="ok">✔ ' + qKg + ' kg fully split.</span>';
  else if (left > 0) rem.innerHTML = '<span class="err">' + sumKg + ' kg of ' + qKg + ' kg split - ' + left + ' kg left.</span>';
  else rem.innerHTML = '<span class="err">' + sumKg + ' kg is MORE than ' + qKg + ' kg (by ' + (-left) + ' kg).</span>';

  if (!searchTokens($('q').value).length || !groups.length) errs.unshift('Choose a product');
  else if (!cands.length) errs.unshift('Click the product you bought');
  if (!qG) errs.push('Quantity missing');
  else if (cands.length && left !== 0) errs.push(left > 0 ? left + ' kg still to split' : 'split is more than the quantity');
  if (cands.length && !rows.length && qG) errs.push('Give kg to at least one size');

  // rate + tax calculator
  var rate = numOf('rate'), inc = (document.querySelector('input[name=inc]:checked') || {}).value, taxCode = $('tax').value;
  var calc = $('calc'), math = null;
  if (isNaN(rate) || rate <= 0) errs.push('Rate missing');
  if (!inc) errs.push('Choose: rate includes tax or excludes tax');
  if (!taxCode) errs.push('Choose the Tax Rate Code');
  if (!isNaN(rate) && rate > 0 && inc && taxCode && qG) {
    var t = TAX[taxCode];
    math = rateMath(rate, $('unit').value === 'kg', inc === 'incl', t, qKg);
    var tot = math.exKg * qKg;
    calc.className = 'calc';
    calc.innerHTML = 'Tax ' + esc(taxCode) + ' = <b>' + t + '%</b> &nbsp;|&nbsp; per kg: <b>' + f2(math.exKg) + '</b> before tax, <b>' + f2(math.inclKg) + '</b> with tax' +
      '<br>For ' + qKg + ' kg: <b>' + f2(tot) + '</b> before tax + tax <b>' + f2(tot * t / 100) + '</b> = <b>' + f2(tot * (1 + t / 100)) + '</b> total' +
      (rows.length ? '<br>' + rows.map(function (r) { return sizeLabel(r.p.g) + ' pack: ' + f2(round4(math.exKg * r.p.g / 1000)) + ' ex tax'; }).join(' &nbsp;·&nbsp; ') : '');
  } else {
    calc.className = 'calc muted';
    calc.textContent = 'Type the rate, choose including / excluding tax and the tax code.';
  }
  $('errs').textContent = errs.join(' · ');
  $('add').disabled = errs.length > 0 || !math;
  return (errs.length || !math) ? null : { rows: rows, math: math, tax: taxCode, t: TAX[taxCode] };
}

function addToList() {
  var pl = recalc();
  if (!pl) return;
  var fresh = [];
  pl.rows.forEach(function (r) {
    var cost = round4(pl.math.exKg * r.p.g / 1000);
    var it = { dd: r.p.dd, name: r.p.name, packs: r.packs, cost: cost, tax: pl.tax, t: pl.t, done: false, q: false };
    items.push(it); fresh.push(it);
  });
  kgs = {}; $('q').value = ''; $('qty').value = ''; $('rate').value = '';   // keep rate unit, incl/excl, tax for the next product
  renderVariants(); renderList();
  if ($('fast').checked) writeItems(fresh);
  $('q').focus();
}

var editIdx = -1;
function renderList() {
  var lb = $('lb'); lb.innerHTML = '';
  var ex = 0, inc = 0;
  items.forEach(function (it, i) {
    var e = it.packs * it.cost, g = e * (1 + it.t / 100);
    ex += e; inc += g;
    var tr = document.createElement('tr');
    if (i === editIdx) {
      tr.className = 'editing';
      var opts = Object.keys(TAX).map(function (k) { return '<option' + (k === it.tax ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('');
      tr.innerHTML = '<td>' + esc(it.dd) + '</td><td class="n"><input type="text" class="ed" id="ePk" value="' + it.packs + '"></td><td class="n"><input type="text" class="ed" id="eCost" value="' + it.cost + '"></td>' +
        '<td><select id="eTax">' + opts + '</select></td><td colspan="2" class="muted" id="eErr"></td>' +
        '<td style="white-space:nowrap"><button class="mini" data-save="' + i + '">✔ Save</button> <button class="sec mini" data-cancel="1">✕</button></td>';
    } else {
      var act = it.q ? '…' : '<button class="sec mini" data-edit="' + i + '" title="Change packs / cost / tax">✎</button> ' +
        (it.sure ? '<button class="mini" data-del="' + i + '">sure?</button>' : '<button class="sec mini" data-del="' + i + '" title="Remove' + (it.done ? ' (empties its row in the sheet)' : '') + '">✕</button>');
      tr.innerHTML = '<td>' + (it.done ? '<span class="ok" title="in the sheet">✔</span> ' : '') + esc(it.dd) + '</td><td class="n">' + it.packs + '</td><td class="n">' + f2(it.cost) + '</td><td>' + esc(it.tax) +
        '</td><td class="n">' + f2(e) + '</td><td class="n">' + f2(g) + '</td><td style="white-space:nowrap">' + act + '</td>';
    }
    lb.appendChild(tr);
  });
  if (items.length) {
    var tr = document.createElement('tr'); tr.className = 'tot';
    tr.innerHTML = '<td>Total (✔ = in the sheet)</td><td></td><td></td><td></td><td class="n">' + f2(ex) + '</td><td class="n">' + f2(inc) + '</td><td></td>';
    lb.appendChild(tr);
  }
  $('lt').style.display = items.length ? '' : 'none';
  $('lempty').style.display = items.length ? 'none' : '';
  $('cnt').textContent = items.length ? '(' + items.length + ' line' + (items.length > 1 ? 's' : '') + ')' : '';
  var pend = items.filter(function (it) { return !it.done && !it.q; }).length;
  $('put').disabled = !pend;
  $('put').textContent = pend ? 'Put ' + pend + ' line(s) in sheet' : 'Put in sheet';
  if (editIdx >= 0 && $('ePk')) { $('ePk').focus(); $('ePk').select(); }
}

function saveEdit(i) {
  var it = items[i]; if (!it) return;
  var pk = Number($('ePk').value.replace(/,/g, '')), cost = Number($('eCost').value.replace(/,/g, '')), tax = $('eTax').value;
  if (!(pk > 0) || Math.round(pk) !== pk) { $('eErr').innerHTML = '<span class="err">Packs: whole number above 0</span>'; return; }
  if (!(cost >= 0) || $('eCost').value.trim() === '') { $('eErr').innerHTML = '<span class="err">Cost: a number</span>'; return; }
  var apply = function () { it.packs = pk; it.cost = cost; it.tax = tax; it.t = TAX[tax]; editIdx = -1; renderList(); };
  if (!it.done) { apply(); return; }
  it.q = true; setMsg('Updating the sheet…');
  google.script.run
    .withSuccessHandler(function () { it.q = false; apply(); setMsg('<span class="ok">✔ Sheet row ' + it.row + ' updated.</span>'); })
    .withFailureHandler(function (e) { it.q = false; renderList(); setMsg('<span class="err">' + esc(e.message) + '</span>'); })
    .lpUpdate(it.row, it.dd, { packs: pk, cost: cost, tax: tax });
}

function delItem(i) {
  var it = items[i]; if (!it || it.q) return;
  if (!it.done) { items.splice(i, 1); editIdx = -1; renderList(); return; }
  if (!it.sure) { items.forEach(function (x) { x.sure = false; }); it.sure = true; renderList(); return; }
  it.q = true; renderList(); setMsg('Emptying the sheet row…');
  google.script.run
    .withSuccessHandler(function () { items.splice(items.indexOf(it), 1); renderList(); setMsg('<span class="ok">✔ Removed; its sheet row was emptied.</span>'); })
    .withFailureHandler(function (e) { it.q = false; it.sure = false; renderList(); setMsg('<span class="err">' + esc(e.message) + '</span>'); })
    .lpClear(it.row, it.dd);
}

function setMsg(html) { $('msg').innerHTML = html; }

// Writes go one after the other (each appends below the last line of the sheet), so fast clicks cannot overlap.
var wq = [], writing = false;
function writeItems(arr) {
  arr = arr.filter(function (it) { return !it.done && !it.q; });
  if (!arr.length) return;
  arr.forEach(function (it) { it.q = true; });
  wq.push(arr); renderList(); pump();
}
function pump() {
  if (writing || !wq.length) return;
  writing = true; var arr = wq.shift();
  setMsg('Writing ' + arr.length + ' line(s)…');
  google.script.run
    .withSuccessHandler(function (r) {
      arr.forEach(function (it, k) { it.done = true; it.q = false; it.row = r.first + k; });
      writing = false; renderList();
      setMsg('<span class="ok">✔ ' + arr.length + ' line(s) in the sheet, rows ' + r.first + '–' + r.last + '.</span>');
      pump();
    })
    .withFailureHandler(function (e) {
      arr.forEach(function (it) { it.q = false; });
      wq.forEach(function (a) { a.forEach(function (it) { it.q = false; }); }); wq = [];   // keep order: the rest stay in the list
      writing = false; renderList();
      setMsg('<span class="err">Not written: ' + esc(e.message) + ' (the lines are still in the list)</span>');
    })
    .lpWrite(arr.map(function (it) { return { dd: it.dd, packs: it.packs, cost: it.cost, tax: it.tax }; }));
}
function putInSheet() { writeItems(items); }

function download() {
  $('dl').disabled = true; setMsg('Making the file…'); $('dlbox').innerHTML = '';
  google.script.run
    .withSuccessHandler(function (r) {
      $('dl').disabled = false;
      if (r.problems) { setMsg('<span class="err">Fix first:</span> ' + esc(r.problems.slice(0, 8).join(' | '))); return; }
      if (r.empty) { setMsg('<span class="err">The sheet has no lines yet.</span>'); return; }
      setMsg('');
      $('dlbox').innerHTML = '<b>' + r.count + '</b> line(s): <a id="dla" href="' + esc(r.url) + '" target="_blank">Download ' + esc(r.name) + '</a> <span id="dlm" class="muted">(removed from Drive 15 s after you click)</span>';
      $('dla').addEventListener('click', function () {
        var n = 15, m = $('dlm');
        var t = setInterval(function () {
          n--; m.textContent = 'Removing from Drive in ' + n + 's...';
          if (n <= 0) { clearInterval(t); google.script.run.withSuccessHandler(function () { m.textContent = 'Removed from Drive.'; }).deleteExportFile(r.fileId); }
        }, 1000);
      });
    })
    .withFailureHandler(function (e) { $('dl').disabled = false; setMsg('<span class="err">' + esc(e.message) + '</span>'); })
    .lpDownload();
}

// ---------- wiring ----------
var qTimer = null;
$('q').addEventListener('input', function () {
  // a size typed after the name ("walnut 40kg") becomes the quantity when the quantity box is empty
  clearTimeout(qTimer); showAll = false; qTimer = setTimeout(renderVariants, 120);
});
$('qty').addEventListener('input', recalc);
$('rate').addEventListener('input', recalc);
$('unit').addEventListener('change', recalc);
$('tax').addEventListener('change', recalc);
Array.prototype.forEach.call(document.getElementsByName('inc'), function (r) { r.addEventListener('change', recalc); });
$('groups').addEventListener('click', function (e) {
  if (e.target.getAttribute && e.target.getAttribute('data-other')) { showAll = true; renderVariants(); return; }
  var b = e.target.closest ? e.target.closest('[data-g]') : null; if (!b) return;
  selGroup = b.getAttribute('data-g'); kgs = {}; showAll = false; renderVariants(); $('qty').focus();
});
$('vb').addEventListener('input', function (e) { var c = e.target.getAttribute('data-c'); if (c) { kgs[c] = e.target.value; recalc(); } });
$('vb').addEventListener('click', function (e) {
  var c = e.target.getAttribute('data-fill'); if (!c) return;
  var qKg = qtyG() / 1000, other = 0;
  cands.forEach(function (p) { if (p.code !== c) other += (parseSum(kgs[p.code] || '', true) || 0) / 1000; });
  var left = Math.round((qKg - other) * 1e6) / 1e6;
  if (left > 0) { kgs[c] = String(left); var inp = document.querySelector('input[data-c="' + CSS.escape(c) + '"]'); if (inp) inp.value = kgs[c]; recalc(); }
});
$('lb').addEventListener('click', function (e) {
  var t = e.target, v;
  if ((v = t.getAttribute('data-edit')) !== null) { editIdx = Number(v); renderList(); }
  else if ((v = t.getAttribute('data-save')) !== null) saveEdit(Number(v));
  else if (t.getAttribute('data-cancel')) { editIdx = -1; renderList(); }
  else if ((v = t.getAttribute('data-del')) !== null) delItem(Number(v));
});
$('lb').addEventListener('keydown', function (e) {
  if (editIdx < 0) return;
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); saveEdit(editIdx); }
  else if (e.key === 'Escape') { editIdx = -1; renderList(); }
});
try { if (localStorage.getItem('lp_fast') === '0') $('fast').checked = false; } catch (e) {}
$('fast').addEventListener('change', function () { try { localStorage.setItem('lp_fast', $('fast').checked ? '1' : '0'); } catch (e) {} });
$('add').addEventListener('click', addToList);
$('put').addEventListener('click', putInSheet);
$('dl').addEventListener('click', download);
// Equal WEIGHT for every ticked size, whole packs only; the few kg that do not fit are given out as extra packs
// (smallest sizes first). Anything that still does not fit is shown as "kg left" to fix by hand.
function splitEqual() {
  var qG = qtyG(); if (!qG) { $('rem').innerHTML = '<span class="err">Type the quantity first (e.g. 10kg).</span>'; $('qty').focus(); return; }
  var sel = cands.filter(function (p) { return useSz[p.code] !== false; });
  if (!sel.length) { $('rem').innerHTML = '<span class="err">Tick at least one size.</span>'; return; }
  var share = qG / sel.length, pk = {}, used = 0;
  sel.forEach(function (p) { pk[p.code] = Math.floor(share / p.g + 1e-9); used += pk[p.code] * p.g; });
  var left = qG - used, moved = true;
  while (moved) { moved = false; sel.forEach(function (p) { if (left + 1e-9 >= p.g) { pk[p.code]++; left -= p.g; moved = true; } }); }
  kgs = {};
  sel.forEach(function (p) { if (pk[p.code] > 0) kgs[p.code] = String(Math.round(pk[p.code] * p.g) / 1000); });
  renderVariants();
  var rate = $('rate'); if (qtyG() && !$('add').disabled) $('add').focus(); else rate.focus();
}
$('eq').addEventListener('click', splitEqual);
$('vb').addEventListener('change', function (e) { var c = e.target.getAttribute('data-use'); if (c) useSz[c] = e.target.checked; });
function kgInputs() { return Array.prototype.slice.call(document.querySelectorAll('input.kg')); }
$('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); clearTimeout(qTimer); renderVariants(); $('qty').focus(); $('qty').select(); } });
$('qty').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); var k = kgInputs(); (k[0] || $('rate')).focus(); } });
// Enter in a kg box: empty = put all remaining kg there; then jump to the next box, after the last one to Rate
$('vb').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.getAttribute('data-c')) return;
  e.preventDefault(); e.stopPropagation();
  var c = e.target.getAttribute('data-c');
  if (!e.target.value.trim()) {
    var qKg = qtyG() / 1000, other = 0;
    cands.forEach(function (p) { if (p.code !== c) other += (parseSum(kgs[p.code] || '', true) || 0) / 1000; });
    var left = Math.round((qKg - other) * 1e6) / 1e6;
    if (left > 0) { kgs[c] = String(left); e.target.value = kgs[c]; recalc(); }
  }
  var used = 0; cands.forEach(function (p) { used += (parseSum(kgs[p.code] || '', true) || 0) / 1000; });
  var k = kgInputs(), at = k.indexOf(e.target);
  // everything split -> straight to Rate, else the next size
  (Math.abs(qtyG() / 1000 - used) < 1e-9 || !k[at + 1] ? $('rate') : k[at + 1]).focus();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('add').disabled && (e.target.tagName === 'INPUT' || e.target === document.body) && editIdx < 0) { e.preventDefault(); addToList(); } });
// segmented buttons look + remember last choices
function paintSeg() { var v = (document.querySelector('input[name=inc]:checked') || {}).value; $('sIncl').className = v === 'incl' ? 'on' : ''; $('sExcl').className = v === 'excl' ? 'on' : ''; }
Array.prototype.forEach.call(document.getElementsByName('inc'), function (r) { r.addEventListener('change', function () { paintSeg(); try { localStorage.setItem('lp_inc', r.value); } catch (e) {} }); });
$('tax').addEventListener('change', function () { try { localStorage.setItem('lp_tax', $('tax').value); } catch (e) {} });
$('unit').addEventListener('change', function () { try { localStorage.setItem('lp_unit', $('unit').value); } catch (e) {} });


// a size typed in the product box and no quantity yet: show it as the quantity hint
$('q').addEventListener('blur', function () { if (!$('qty').value.trim()) { var g = parseSum($('q').value, false); if (g) { $('qty').value = g >= 1000 ? (g / 1000) + 'kg' : g + 'g'; recalc(); } } });

function init(d) {
  P = d.products.map(function (r) { return { code: r[0], name: r[1], npp: r[2], dd: r[3], up: String(r[1]).toUpperCase(), g: sizeOfName(r[1]), words: String(r[1]).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean), base: stripSizes(r[1]).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim() }; });
  d.taxes.forEach(function (t) { TAX[t[0]] = t[1]; });
  var sel = $('tax'); sel.innerHTML = '<option value="">– choose –</option>';
  d.taxes.forEach(function (t) { var o = document.createElement('option'); o.value = t[0]; o.textContent = t[0] + '  (' + t[1] + '%)'; sel.appendChild(o); });
  if (d.defTax && TAX[d.defTax] !== undefined) sel.value = d.defTax;
  try {
    var st = localStorage.getItem('lp_tax'); if (st && TAX[st] !== undefined) sel.value = st;
    var si = localStorage.getItem('lp_inc'); if (si) { var rr = document.querySelector('input[name=inc][value=' + si + ']'); if (rr) rr.checked = true; }
    var su = localStorage.getItem('lp_unit'); if (su) $('unit').value = su;
  } catch (e) {}
  paintSeg();
  loaded = true; renderVariants();
}
if (window.google && google.script) {
  google.script.run.withSuccessHandler(init).withFailureHandler(function (e) { $('hint').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }).lpGetData();
}
$('q').focus();
renderList();
</script>
</body>
